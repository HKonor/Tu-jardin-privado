<!DOCTYPE html>
<html lang="es">

<body>

            id="contenedor-flores"

        <div class="mensaje">
            <p>
                Esta es la primera flor de este pequeño jardín.
            </p>
            <span>💛</span>
        </div>
    </main>
    <script src="js/flores.js"></script>
    <script src="js/app.js"></script>

</html>
